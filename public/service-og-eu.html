<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mekkoo – Service og EU-kontroll</title>
  <!-- Flyttet: alt om bilen ligger nå under «Bilen din» på forsiden, i fanen «Service og EU-kontroll». -->
  <script>
    (function () {
      var bil = new URLSearchParams(location.search).get("bil");
      location.replace("/?" + (bil ? "bil=" + encodeURIComponent(bil) + "&" : "") + "fane=service#bilen-din");
    })();
  </script>
</head>
<body>
  <p><a href="/?fane=service#bilen-din">Service og EU-kontroll har flyttet til «Bilen din». Trykk her hvis du ikke blir sendt videre.</a></p>
</body>
</html>
